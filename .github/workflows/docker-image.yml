name: Docker Image CI/CD

on:
  push:
    branches: ["development"]

permissions:
  contents: read
  packages: write

jobs:
  build-development:
    runs-on: ubuntu-latest
    if: github.ref_name == 'development'

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Create env from GitHub Secret
        run: |
          echo "${{ secrets.DEV_ENV_FILE }}" > .env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (Development)
        run: |
          set -e

          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')

          docker buildx build \
            --platform linux/amd64 \
            --tag ghcr.io/$OWNER/garuda-property-dev:latest \
            --push .

  deploy-development:
    runs-on: ubuntu-latest
    needs: build-development
    if: github.ref_name == 'development'

    steps:
      - name: Deploy to VPS (Development)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST_DEV }}
          username: ${{ secrets.VPS_USERNAME_DEV }}
          key: ${{ secrets.VPS_SSH_KEY_DEV }}
          port: ${{ secrets.VPS_PORT_DEV }}
          script: |
            set -e

            OWNER="${{ secrets.GHCR_OWNER }}"
            OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

            CONTAINER_NAME=garuda-property-dev

            docker rm -f "$CONTAINER_NAME" || true

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull ghcr.io/$OWNER/garuda-property-dev:latest

            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p 3030:3030 \
              ghcr.io/$OWNER/garuda-property-dev:latest

            docker image prune -a -f
            docker builder prune -f
